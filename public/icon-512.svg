<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="256" cy="230" rx="190" ry="160" fill="url(#spot)"/>

  <!-- press-conference backdrop arcs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6">
    <path d="M60 430 Q256 350 452 430"/>
    <path d="M84 470 Q256 400 428 470"/>
  </g>

  <!-- bowing figure (Manager Kim silhouette) -->
  <g transform="translate(256 250)">
    <circle cx="0" cy="-58" r="44" fill="#edd3b2" stroke="#231f20" stroke-width="9"/>
    <path d="M-44 -84 C-44 -112 -24 -124 0 -124 C24 -124 44 -112 44 -84 C30 -96 14 -100 0 -100 C-16 -100 -32 -94 -44 -84 Z"
          fill="#2a2723" stroke="#1a1816" stroke-width="6"/>
    <!-- torso leaning forward = bow -->
    <path d="M-58 96 C-58 20 -36 -6 0 -6 C36 -6 58 20 58 96 Z"
          fill="#2e3a47" stroke="#231f20" stroke-width="9"/>
    <!-- shirt + tie -->
    <path d="M-16 -6 L0 62 L16 -6 Z" fill="#f4ebd9" stroke="#231f20" stroke-width="5"/>
    <path d="M-3 -2 L8 4 L2 34 L12 60 L-2 66 L-7 34 Z" fill="#99382e" stroke="#231f20" stroke-width="4"/>
    <!-- sweat drop -->
    <path d="M40 -96 C30 -84 34 -70 42 -70 C50 -70 54 -84 44 -96 Z" fill="#8ad4eb" stroke="#1d647a" stroke-width="4"/>
  </g>

  <!-- headline bar -->
  <rect x="64" y="48" width="384" height="16" rx="8" fill="#fbbf24"/>
  <rect x="120" y="76" width="272" height="10" rx="5" fill="#fbbf24" fill-opacity="0.6"/>

  <!-- microphone -->
  <g transform="translate(392 300)">
    <rect x="-14" y="-6" width="28" height="66" rx="12" fill="#586361" stroke="#231f20" stroke-width="7"/>
    <path d="M-30 22 Q-30 58 0 58 Q30 58 30 22" fill="none" stroke="#231f20" stroke-width="7"/>
    <path d="M0 58 L0 78" stroke="#231f20" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
